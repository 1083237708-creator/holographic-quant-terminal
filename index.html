<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全息量化决策终端</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0a0a0c; color: #d1d5db; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 顶部标题栏 */
        .top-header { padding: 12px 15px; background: #141414; border-bottom: 1px solid #2a2a2a; font-size: 16px; font-weight: bold; color: #fff; text-align: center; }
        
        /* 中间主内容区 */
        .main-content { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 60px; }
        
        /* 底部导航栏 */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 50px; background: #141414; border-top: 1px solid #2a2a2a; display: flex; justify-content: space-around; align-items: center; z-index: 999; }
        .nav-item { flex: 1; text-align: center; font-size: 12px; color: #888; padding: 10px 0; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: #ef232a; font-weight: bold; }
        
        /* 页面区块（控制显示隐藏） */
        .page-view { display: none; }
        .page-view.active { display: block; }
        
        /* 输入框与按钮 */
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-box input { flex: 1; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 15px; outline: none; }
        .search-box button { padding: 0 20px; background: #ef232a; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; }
        
        /* 卡片样式 */
        .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .card-title { font-size: 14px; color: #ccc; margin-bottom: 12px; border-left: 3px solid #ef232a; padding-left: 8px; font-weight: bold; }
        
        .score-panel { display: flex; justify-content: space-between; align-items: center; }
        .score-value { font-size: 32px; color: #ff9800; font-weight: bold; line-height: 1; margin-top: 5px; }
        .signal-tag { padding: 6px 12px; border-radius: 4px; font-size: 14px; background: rgba(239, 35, 42, 0.1); color: #ef232a; border: 1px solid #ef232a; font-weight: bold; }

        /* 图表容器，必须给明确高度 */
        #klineChart { width: 100%; height: 300px; }
        #macdChart { width: 100%; height: 120px; }
        
        /* 表格 */
        .lhb-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .lhb-table th { text-align: left; padding: 8px 0; color: #888; border-bottom: 1px solid #333; }
        .lhb-table td { padding: 10px 0; border-bottom: 1px solid #222; }
        .buy { color: #ef232a; }
        .sell { color: #14b143; }

        /* 占位提示 */
        .placeholder { text-align: center; color: #555; padding: 50px 20px; font-size: 14px; line-height: 2; }
    </style>
</head>
<body>
    <div class="top-header">全息量化决策终端</div>

    <div class="main-content">
        <!-- 页面 1：个股分析 -->
        <div id="page-analysis" class="page-view active">
            <div class="search-box">
                <input type="text" id="stockCode" placeholder="输入股票代码，如 600351" value="600351">
                <button onclick="analyze()">分析</button>
            </div>

            <div class="card score-panel">
                <div>
                    <div style="font-size:12px; color:#888;">多维度综合评分</div>
                    <div class="score-value" id="scoreVal">--</div>
                </div>
                <div>
                    <div style="font-size:12px; color:#888; text-align:right; margin-bottom:5px;">AI 策略信号</div>
                    <div class="signal-tag" id="signalTag">等待分析</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">K线形态与均线系统</div>
                <div id="klineChart"></div>
            </div>

            <div class="card">
                <div class="card-title">MACD 趋势</div>
                <div id="macdChart"></div>
            </div>

            <div class="card">
                <div class="card-title">龙虎榜资金博弈（演示）</div>
                <table class="lhb-table">
                    <thead>
                        <tr>
                            <th>营业部/席位</th>
                            <th style="text-align:right;">买入(万)</th>
                            <th style="text-align:right;">卖出(万)</th>
                        </tr>
                    </thead>
                    <tbody id="lhbBody">
                        <!-- 动态注入 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 页面 2：智能选股 -->
        <div id="page-screener" class="page-view">
            <div class="placeholder">
                智能选股引擎<br>
                (此处需连接 Python 后端执行多因子扫盘)
            </div>
        </div>

        <!-- 页面 3：大盘概览 -->
        <div id="page-market" class="page-view">
            <div class="placeholder">
                大盘与板块资金流向<br>
                (此处需连接 Python 后端获取实时行情)
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('analysis', this)">个股分析</div>
        <div class="nav-item" onclick="switchPage('screener', this)">智能选股</div>
        <div class="nav-item" onclick="switchPage('market', this)">大盘概览</div>
    </div>

    <script>
        let klineChart, macdChart;

        // 切换页面逻辑
        function switchPage(pageId, element) {
            // 隐藏所有页面
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
            // 取消所有导航高亮
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            // 显示目标页面
            document.getElementById('page-' + pageId).classList.add('active');
            element.classList.add('active');

            // 如果切回个股分析，需要重新调整图表大小
            if(pageId === 'analysis') {
                setTimeout(() => {
                    if(klineChart) klineChart.resize();
                    if(macdChart) macdChart.resize();
                }, 100);
            }
        }

        function initCharts() {
            klineChart = echarts.init(document.getElementById('klineChart'), 'dark');
            macdChart = echarts.init(document.getElementById('macdChart'), 'dark');
        }

        function generateMockData() {
            let kline = [];
            let basePrice = 10.0;
            for (let i = 60; i >= 0; i--) {
                let open = basePrice + Math.sin(i) * 0.3;
                let close = open + Math.cos(i) * 0.4;
                let high = Math.max(open, close) + 0.2;
                let low = Math.min(open, close) - 0.2;
                kline.push({
                    date: `10-${(i%30+1).toString().padStart(2, '0')}`,
                    open: open.toFixed(2), close: close.toFixed(2), low: low.toFixed(2), high: high.toFixed(2),
                    MA5: (open + close)/2, MA10: open,
                    MACD_HIST: Math.sin(i * 0.5),
                    MACD_DIF: Math.cos(i * 0.5)
                });
                basePrice = close;
            }
            return kline;
        }

        function analyze() {
            const code = document.getElementById('stockCode').value;
            if (!code) return alert('请输入代码');

            // 模拟加载状态
            document.getElementById('scoreVal').innerText = "...";
            document.getElementById('signalTag').innerText = "计算中";

            setTimeout(() => {
                // 固定评分演示
                document.getElementById('scoreVal').innerText = "85";
                const sig = document.getElementById('signalTag');
                sig.innerText = "买入候选";
                
                const mockKline = generateMockData();
                const dates = mockKline.map(k => k.date);
                const values = mockKline.map(k => [parseFloat(k.open), parseFloat(k.close), parseFloat(k.low), parseFloat(k.high)]);

                klineChart.setOption({
                    backgroundColor: '#141414',
                    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                    grid: { left: '12%', right: '5%', bottom: '15%', top: '10%' },
                    xAxis: { type: 'category', data: dates, axisLabel: { color: '#666', fontSize: 10 }, axisLine: { lineStyle: { color: '#333' } } },
                    yAxis: { scale: true, axisLabel: { color: '#666' }, splitLine: { lineStyle: { color: '#222' } } },
                    series: [
                        { name: 'K线', type: 'candlestick', data: values, itemStyle: { color: '#ef232a', color0: '#14b143', borderColor: '#ef232a', borderColor0: '#14b143' } },
                        { name: 'MA5', type: 'line', data: mockKline.map(k => parseFloat(k.MA5)), smooth: true, lineStyle: { width: 1, color: '#f5d547' }, symbol: 'none' }
                    ]
                });

                macdChart.setOption({
                    backgroundColor: '#141414',
                    tooltip: { trigger: 'axis' },
                    grid: { left: '12%', right: '5%', bottom: '15%', top: '10%' },
                    xAxis: { type: 'category', data: dates, show: false },
                    yAxis: { scale: true, axisLabel: { color: '#666' }, splitLine: { lineStyle: { color: '#222' } } },
                    series: [
                        { name: 'MACD', type: 'bar', data: mockKline.map(k => k.MACD_HIST), itemStyle: { color: (params) => params.data >= 0 ? '#ef232a' : '#14b143' } },
                        { name: 'DIF', type: 'line', data: mockKline.map(k => k.MACD_DIF), lineStyle: { width: 1, color: '#f5d547' }, symbol: 'none' }
                    ]
                });

                // 渲染龙虎榜
                document.getElementById('lhbBody').innerHTML = `
                    <tr><td>华鑫证券上海分公司<br><span style="color:#666;font-size:10px;">(游资)</span></td><td style="text-align:right;" class="buy">+8,500</td><td style="text-align:right;" class="sell">-120</td></tr>
                    <tr><td>机构专用</td><td style="text-align:right;" class="buy">+5,100</td><td style="text-align:right;" class="sell">0</td></tr>
                    <tr><td>拉萨团结路第二营业部</td><td style="text-align:right;" class="buy">+3,200</td><td style="text-align:right;" class="sell">-4,500</td></tr>
                `;
            }, 500); // 延迟0.5秒模拟网络请求
        }

        window.onload = function() {
            initCharts();
            // 自动执行一次分析
            analyze();
            
            window.addEventListener('resize', () => { 
                if(klineChart) klineChart.resize(); 
                if(macdChart) macdChart.resize(); 
            });
        }
    </script>
</body>
</html>
