<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多维度量化分析 - 终端</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0a0a0a; color: #d1d5db; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 顶部导航 */
        .nav-bar { display: flex; background: #121212; border-bottom: 1px solid #333; overflow-x: auto; white-space: nowrap; }
        .nav-item { padding: 12px 16px; font-size: 14px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
        .nav-item.active { color: #fff; border-bottom-color: #ef232a; font-weight: bold; }
        
        /* 主体内容区 */
        .main-content { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        
        /* 搜索与评分块 */
        .search-panel { display: flex; gap: 10px; }
        .search-panel input { flex: 1; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 4px; }
        .search-panel button { padding: 10px 20px; background: #ef232a; color: #fff; border: none; border-radius: 4px; font-weight: bold; }
        
        .score-panel { display: flex; justify-content: space-between; background: #121212; border: 1px solid #333; border-radius: 6px; padding: 15px; }
        .score-title { font-size: 12px; color: #888; margin-bottom: 5px; }
        .score-value { font-size: 28px; color: #ff9800; font-weight: bold; }
        .signal-tag { padding: 4px 10px; border-radius: 4px; font-size: 13px; background: rgba(239, 35, 42, 0.1); color: #ef232a; border: 1px solid #ef232a; }
        
        /* 图表卡片 */
        .card { background: #121212; border: 1px solid #333; border-radius: 6px; padding: 10px; }
        .card-title { font-size: 13px; color: #ccc; margin-bottom: 10px; border-left: 3px solid #ef232a; padding-left: 8px; }
        
        /* 龙虎榜区块 */
        .lhb-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .lhb-table th { text-align: left; padding: 8px 0; color: #888; border-bottom: 1px solid #333; font-weight: normal; }
        .lhb-table td { padding: 8px 0; border-bottom: 1px solid #222; }
        .buy { color: #ef232a; }
        .sell { color: #14b143; }
        
        #klineChart { width: 100%; height: 300px; }
        #macdChart { width: 100%; height: 120px; }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="nav-bar">
        <div class="nav-item active">智能选股</div>
        <div class="nav-item">个股分析</div>
        <div class="nav-item">大盘概览</div>
        <div class="nav-item">龙虎榜席位</div>
        <div class="nav-item">AI 舆情</div>
    </div>

    <div class="main-content">
        <!-- 搜索框 -->
        <div class="search-panel">
            <input type="text" id="stockCode" placeholder="输入代码，如 600351" value="600351">
            <button onclick="analyze()">分析</button>
        </div>

        <!-- 评分卡 -->
        <div class="score-panel">
            <div>
                <div class="score-title">综合评分</div>
                <div class="score-value" id="scoreVal">--</div>
            </div>
            <div>
                <div class="score-title">AI 策略信号</div>
                <div class="signal-tag" id="signalTag">等待分析</div>
            </div>
        </div>

        <!-- K线图 -->
        <div class="card">
            <div class="card-title">K线形态与均线系统</div>
            <div id="klineChart"></div>
        </div>

        <!-- MACD 图 -->
        <div class="card">
            <div class="card-title">MACD 趋势</div>
            <div id="macdChart"></div>
        </div>

        <!-- 龙虎榜区块（新增） -->
        <div class="card">
            <div class="card-title">龙虎榜资金博弈</div>
            <table class="lhb-table">
                <thead>
                    <tr>
                        <th>营业部名称</th>
                        <th style="text-align:right;">买入(万)</th>
                        <th style="text-align:right;">卖出(万)</th>
                    </tr>
                </thead>
                <tbody id="lhbBody">
                    <!-- 数据由 JS 注入 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let klineChart, macdChart;

        function initCharts() {
            klineChart = echarts.init(document.getElementById('klineChart'), 'dark');
            macdChart = echarts.init(document.getElementById('macdChart'), 'dark');
        }

        // 假数据生成器（这次让数据固定一点，不要每次刷新）
        function generateMockData() {
            let kline = [];
            let basePrice = 10.0;
            // 生成固定的K线
            for (let i = 50; i >= 0; i--) {
                let open = basePrice + Math.sin(i) * 0.5;
                let close = open + Math.cos(i) * 0.6;
                let high = Math.max(open, close) + 0.3;
                let low = Math.min(open, close) - 0.3;
                kline.push({
                    date: `2026-10-${i+1}`.padStart(2, '0'),
                    open: open.toFixed(2), close: close.toFixed(2), low: low.toFixed(2), high: high.toFixed(2),
                    MA5: (open + close)/2, MA10: open,
                    MACD_HIST: Math.sin(i * 0.5),
                    MACD_DIF: Math.cos(i * 0.5)
                });
                basePrice = close;
            }
            return kline;
        }

        function analyze() {
            const code = document.getElementById('stockCode').value;
            if (!code) return alert('请输入代码');

            // 固定评分，不再随机变化
            document.getElementById('scoreVal').innerText = "85";
            const sig = document.getElementById('signalTag');
            sig.innerText = "买入候选";
            sig.style.color = "#ef232a";
            sig.style.borderColor = "#ef232a";
            sig.style.background = "rgba(239, 35, 42, 0.1)";

            // 渲染图表
            const mockKline = generateMockData();
            const dates = mockKline.map(k => k.date);
            const values = mockKline.map(k => [parseFloat(k.open), parseFloat(k.close), parseFloat(k.low), parseFloat(k.high)]);

            klineChart.setOption({
                backgroundColor: '#121212',
                tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                grid: { left: '10%', right: '5%', bottom: '15%', top: '10%' },
                xAxis: { type: 'category', data: dates, axisLabel: { color: '#666', fontSize: 10 }, axisLine: { lineStyle: { color: '#333' } } },
                yAxis: { scale: true, axisLabel: { color: '#666' }, splitLine: { lineStyle: { color: '#222' } } },
                series: [
                    { name: 'K线', type: 'candlestick', data: values, itemStyle: { color: '#ef232a', color0: '#14b143', borderColor: '#ef232a', borderColor0: '#14b143' } },
                    { name: 'MA5', type: 'line', data: mockKline.map(k => parseFloat(k.MA5)), smooth: true, lineStyle: { width: 1, color: '#f5d547' }, symbol: 'none' }
                ]
            });

            macdChart.setOption({
                backgroundColor: '#121212',
                tooltip: { trigger: 'axis' },
                grid: { left: '10%', right: '5%', bottom: '15%', top: '10%' },
                xAxis: { type: 'category', data: dates, show: false },
                yAxis: { scale: true, axisLabel: { color: '#666' }, splitLine: { lineStyle: { color: '#222' } } },
                series: [
                    { name: 'MACD', type: 'bar', data: mockKline.map(k => k.MACD_HIST), itemStyle: { color: (params) => params.data >= 0 ? '#ef232a' : '#14b143' } },
                    { name: 'DIF', type: 'line', data: mockKline.map(k => k.MACD_DIF), lineStyle: { width: 1, color: '#f5d547' }, symbol: 'none' }
                ]
            });

            // 渲染假龙虎榜数据
            const lhbBody = document.getElementById('lhbBody');
            lhbBody.innerHTML = `
                <tr>
                    <td>华鑫证券上海分公司<br><span style="color:#666;font-size:10px;">(章盟主)</span></td>
                    <td style="text-align:right;" class="buy">+8,500</td>
                    <td style="text-align:right;" class="sell">-120</td>
                </tr>
                <tr>
                    <td>东方财富拉萨团结路第二营业部<br><span style="color:#666;font-size:10px;">(散户大本营)</span></td>
                    <td style="text-align:right;" class="buy">+3,200</td>
                    <td style="text-align:right;" class="sell">-4,500</td>
                </tr>
                <tr>
                    <td>机构专用</td>
                    <td style="text-align:right;" class="buy">+5,100</td>
                    <td style="text-align:right;" class="sell">0</td>
                </tr>
            `;
        }

        window.onload = function() {
            initCharts();
            window.addEventListener('resize', () => { klineChart.resize(); macdChart.resize(); });
        }
    </script>
</body>
</html>
